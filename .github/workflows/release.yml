name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # Statically linked, so the action does not care what the runner image ships.
      # tuf-ci depends on no smart-card libraries; only tuf-sign does, and that is not
      # built here.
      - name: Build tuf-ci
        run: |
          sudo apt-get update && sudo apt-get install --yes musl-tools
          cargo build --release --locked --package tuf-ci --target x86_64-unknown-linux-musl

      - name: Record the digest
        id: digest
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/tuf-ci
          cp "$binary" tuf-ci-x86_64-unknown-linux-musl
          sha256=$(sha256sum tuf-ci-x86_64-unknown-linux-musl | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  tuf-ci-x86_64-unknown-linux-musl" > tuf-ci-x86_64-unknown-linux-musl.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes \
            tuf-ci-x86_64-unknown-linux-musl \
            tuf-ci-x86_64-unknown-linux-musl.sha256

      # The action runs whatever version.env pins, so the release is not usable until this
      # lands on the default branch.
      - name: Point the action at this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s|^TUF_CI_VERSION=.*|TUF_CI_VERSION=${TAG}|" \
            -e "s|^TUF_CI_SHA256=.*|TUF_CI_SHA256=${SHA256}|" \
            -e "s|^TUF_CI_REPO=.*|TUF_CI_REPO=${GITHUB_REPOSITORY}|" \
            actions/signing-event/version.env

          git -c user.name=tuf-ci \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --signoff --message "Point the signing-event action at ${TAG}" \
              -- actions/signing-event/version.env
          git push origin "HEAD:refs/heads/release/${TAG}"
          gh pr create --base main --head "release/${TAG}" \
            --title "Point the signing-event action at ${TAG}" \
            --body "Generated by the release workflow."
        # Requires: pull-requests write. Kept separate so a failure here does not
        # invalidate the published release.
        continue-on-error: true
