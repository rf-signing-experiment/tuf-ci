name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Nothing here pushes; `gh release create` uses GH_TOKEN directly.
          persist-credentials: false

      # The runner image ships rustup, so the toolchain needs no third-party action.
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --target x86_64-unknown-linux-musl
          rustup default stable

      # Statically linked, so the action does not care what the runner image ships.
      # tuf-ci depends on no smart-card libraries; only tuf-sign does, and that is not
      # built here.
      - name: Build tuf-ci
        run: |
          sudo apt-get update && sudo apt-get install --yes musl-tools
          cargo build --release --locked --package tuf-ci --target x86_64-unknown-linux-musl

      - name: Record the digest
        id: digest
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/tuf-ci
          cp "$binary" tuf-ci-x86_64-unknown-linux-musl
          sha256=$(sha256sum tuf-ci-x86_64-unknown-linux-musl | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  tuf-ci-x86_64-unknown-linux-musl" > tuf-ci-x86_64-unknown-linux-musl.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes \
            tuf-ci-x86_64-unknown-linux-musl \
            tuf-ci-x86_64-unknown-linux-musl.sha256

      # The action runs whatever version.env pins, so a release is not usable until that
      # file is updated on the default branch.
      - name: Say how to point the action at this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA256: ${{ steps.digest.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo "## Release \`${TAG}\` published"
            echo
            echo "The signing-event action still points at the previous release. To move it,"
            echo "commit this to \`main\`:"
            echo
            echo '```'
            echo "TUF_CI_REPO=${GITHUB_REPOSITORY}"
            echo "TUF_CI_VERSION=${TAG}"
            echo "TUF_CI_SHA256=${SHA256}"
            echo '```'
            echo
            echo "as \`actions/signing-event/version.env\`, keeping the comment header. Or:"
            echo
            echo '```console'
            echo "\$ sed -i \\"
            echo "    -e 's|^TUF_CI_REPO=.*|TUF_CI_REPO=${GITHUB_REPOSITORY}|' \\"
            echo "    -e 's|^TUF_CI_VERSION=.*|TUF_CI_VERSION=${TAG}|' \\"
            echo "    -e 's|^TUF_CI_SHA256=.*|TUF_CI_SHA256=${SHA256}|' \\"
            echo "    actions/signing-event/version.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
